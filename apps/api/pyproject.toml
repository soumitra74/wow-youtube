[project]
name = "wow-api"
version = "0.1.0"
description = "FastAPI browse UI for the YouTube digest archive"
requires-python = ">=3.12"
dependencies = [
    "wow-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
wow-serve = "wow_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_api"]

[tool.uv.sources]
wow-core = { workspace = true }
