<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Digest</title>
  <script>
    (function () {
      const saved = localStorage.getItem("wow-theme");
      const theme = saved === "light" || saved === "dark"
        ? saved
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root, html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14110e;
      --bg-glow: #2a2118;
      --panel: #1d1914;
      --ink: #f3ead9;
      --muted: #b5a58c;
      --line: #3a3228;
      --accent: #e07a3d;
      --accent-2: #7eb8a5;
      --high: #e07a3d;
      --medium: #d4b15d;
      --low: #7f8b7a;
      --input: #100e0b;
      --action-ink: #1a120c;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f4eee4;
      --bg-glow: #fbe6c8;
      --panel: #fffaf2;
      --ink: #241c14;
      --muted: #74685a;
      --line: #e0d4c4;
      --accent: #d66a2c;
      --accent-2: #2f7a68;
      --high: #c45e24;
      --medium: #9a7a28;
      --low: #5a6b5c;
      --input: #fffdf8;
      --action-ink: #fffaf2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: radial-gradient(1200px 600px at 10% -10%, var(--bg-glow) 0%, var(--bg) 45%);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 28px 32px 12px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }
    header p { margin: 6px 0 0; color: var(--muted); }
    nav {
      display: flex;
      gap: 8px;
      padding: 16px 32px 0;
      align-items: center;
    }
    #theme-toggle { margin-left: auto; flex-shrink: 0; }
    #theme-toggle .icon-moon { display: none; }
    html[data-theme="light"] #theme-toggle .icon-sun { display: none; }
    html[data-theme="light"] #theme-toggle .icon-moon { display: block; }
    nav button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      font: inherit;
    }
    nav button.icon {
      width: 38px;
      height: 38px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    nav button.icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    nav button.icon.busy svg {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    nav #fetch-status {
      margin: 0 0 0 6px;
      font-size: 0.9rem;
    }
    nav .fetch-inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    nav .nav-sep {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      user-select: none;
    }
    nav #fetch-url-input {
      width: min(300px, 36vw);
      min-width: 160px;
      padding: 7px 10px;
      border-radius: 999px;
    }
    nav button.active, nav button:hover {
      color: var(--ink);
      border-color: var(--accent);
    }
    nav button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    main { padding: 20px 32px 48px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .filters, .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select, textarea {
      background: var(--input);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { width: 100%; min-height: 90px; }
    button.action {
      background: var(--accent);
      color: var(--action-ink);
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      vertical-align: top;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }
    th { color: var(--muted); font-weight: 600; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 8px;
      color: var(--accent-2);
      font-size: 0.8rem;
    }
    .rel-high { color: var(--high); }
    .rel-medium { color: var(--medium); }
    .rel-low { color: var(--low); }
    .muted { color: var(--muted); }
    .answer {
      white-space: pre-wrap;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .hidden { display: none; }
    .summary-link {
      display: block;
      margin: 4px 0 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .summary-link:hover, .summary-link:focus-visible {
      color: var(--accent-2);
      text-decoration: underline;
    }
    dialog {
      width: min(900px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.72); }
    .detail-header {
      position: sticky;
      top: 0;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .detail-header h2 { margin: 0 0 4px; }
    .detail-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .detail-body { padding: 4px 22px 24px; overflow-y: auto; }
    .detail-body h3 { margin: 22px 0 8px; }
    .detail-text {
      white-space: pre-wrap;
      line-height: 1.65;
    }
    .detail-close {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      padding: 5px 10px;
    }
    .detail-delete {
      border: 1px solid var(--high);
      border-radius: 999px;
      background: transparent;
      color: var(--high);
      cursor: pointer;
      font: inherit;
      padding: 5px 10px;
    }
    .detail-delete:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    #detail-takeaways { line-height: 1.6; }
    .detail-body details { margin-top: 22px; }
    .detail-body details > summary {
      cursor: pointer;
      font-weight: 600;
    }
    .detail-scroll {
      max-height: 45vh;
      overflow: auto;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--input);
    }
    .detail-chat {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .detail-chat-heading {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
      margin: 22px 0 0;
    }
    .detail-chat-heading h3 { margin: 0; }
    .detail-chat-verify-pill {
      border: 1px solid var(--accent-2);
      border-radius: 999px;
      background: transparent;
      color: var(--accent-2);
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
      padding: 4px 12px;
      line-height: 1.35;
    }
    .detail-chat-verify-pill:hover,
    .detail-chat-verify-pill:focus-visible {
      background: var(--input);
    }
    .detail-chat-verify-pill:disabled {
      cursor: wait;
      opacity: 0.6;
    }
    #detail-chat-log {
      max-height: 28vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0 12px;
      padding: 4px 2px;
    }
    .chat-bubble {
      max-width: 92%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: var(--input);
      border: 1px solid var(--line);
    }
    .chat-bubble.assistant {
      align-self: flex-start;
      background: transparent;
      border: 1px solid var(--line);
    }
    .chat-web-footnote {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .chat-web-footnote a { color: var(--accent-2); }
    #detail-chat-input {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--input);
      color: var(--ink);
      font: inherit;
      box-sizing: border-box;
    }
    .detail-chat-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      margin-top: 10px;
    }
    .detail-chat-controls label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 0.92rem;
    }
    #custom-dates {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    #custom-dates.hidden { display: none; }
    a { color: var(--accent-2); }
    .status { margin: 8px 0 14px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>YouTube Digest</h1>
    <p>Personal archive — browse, search, ask, and watch topic volume over time.</p>
  </header>
  <nav>
    <button class="active" data-view="browse">Browse</button>
    <button data-view="semantic">Semantic search</button>
    <button data-view="ask">Ask</button>
    <button data-view="trends">Trends</button>
    <span class="fetch-inline">
      <button type="button" id="fetch-latest" class="icon" title="Fetch latest from YouTube" aria-label="Fetch latest from YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 0 0-15.36-6.36"/>
          <polyline points="3 3 3 9 9 9"/>
          <path d="M3 12a9 9 0 0 0 15.36 6.36"/>
          <polyline points="21 21 21 15 15 15"/>
        </svg>
      </button>
      <span class="nav-sep" aria-hidden="true">|</span>
      <input type="url" id="fetch-url-input" placeholder="YouTube URL" aria-label="YouTube URL" />
      <button type="button" id="fetch-url-now" class="icon" title="Fetch Now" aria-label="Fetch Now">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12"/>
          <polyline points="8 11 12 15 16 11"/>
          <path d="M5 21h14"/>
        </svg>
      </button>
    </span>
    <span id="fetch-status" class="status"></span>
    <button type="button" id="theme-toggle" class="icon" title="Switch to light theme" aria-label="Switch to light theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>
      </svg>
    </button>
  </nav>
  <main>
    <section id="view-browse" class="panel">
      <div class="filters">
        <select id="channel"></select>
        <select id="date-range" aria-label="Date range">
          <option value="24h">Last 24 hours</option>
          <option value="sync24h">Synced last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="30d" selected>Last 30 days</option>
          <option value="90d">Last 90 days</option>
          <option value="ytd">YTD</option>
          <option value="custom">Custom</option>
        </select>
        <span id="custom-dates" class="hidden">
          <input type="date" id="date-from" aria-label="From date" />
          <input type="date" id="date-to" aria-label="To date" />
        </span>
        <input id="topic" placeholder="Topic tag" />
        <select id="relevance">
          <option value="">Any relevance</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="watched">
          <option value="">Watched or not</option>
          <option value="false">Unwatched</option>
          <option value="true">Watched</option>
        </select>
        <input id="keyword" placeholder="Keyword (title or summary)" />
        <button class="action" id="apply-filters">Apply</button>
      </div>
      <div id="browse-status" class="status"></div>
      <table>
        <thead>
          <tr>
            <th>Published</th>
            <th>Channel</th>
            <th>Title</th>
            <th>Relevance</th>
            <th>Topics</th>
            <th>Watched</th>
          </tr>
        </thead>
        <tbody id="video-rows"></tbody>
      </table>
    </section>

    <section id="view-semantic" class="panel hidden">
      <div class="search-row">
        <input id="semantic-q" placeholder="Semantic query over summaries" style="min-width: 320px" />
        <button class="action" id="semantic-go">Search</button>
      </div>
      <div id="semantic-status" class="status"></div>
      <div id="semantic-results"></div>
    </section>

    <section id="view-ask" class="panel hidden">
      <textarea id="ask-q" placeholder="Ask a question across your archived videos" title="Ctrl+Enter to ask"></textarea>
      <div class="search-row">
        <button class="action" id="ask-go">Ask</button>
      </div>
      <div id="ask-status" class="status"></div>
      <div id="ask-answer" class="answer"></div>
      <div id="ask-sources"></div>
    </section>

    <section id="view-trends" class="panel hidden">
      <div class="filters">
        <select id="trend-period">
          <option value="week">Weekly</option>
          <option value="month">Monthly</option>
        </select>
        <select id="trend-months">
          <option value="3">Last 3 months</option>
          <option value="6">Last 6 months</option>
          <option value="12">Last 12 months</option>
        </select>
        <button class="action" id="trend-go">Refresh</button>
      </div>
      <canvas id="trend-chart" height="120"></canvas>
    </section>
  </main>
  <dialog id="video-detail" aria-labelledby="detail-title">
    <div class="detail-header">
      <div>
        <h2 id="detail-title">Video details</h2>
        <div id="detail-meta" class="muted"></div>
      </div>
      <div class="detail-actions">
        <button type="button" class="detail-delete" id="detail-delete" disabled>Delete</button>
        <button type="button" class="detail-close" id="detail-close" aria-label="Close details">Close</button>
      </div>
    </div>
    <div class="detail-body">
      <div id="detail-status" class="status"></div>
      <div id="detail-content" class="hidden">
        <h3>Detailed summary</h3>
        <div id="detail-long-summary" class="detail-text"></div>
        <h3>Key takeaways</h3>
        <ul id="detail-takeaways"></ul>
        <details id="detail-description-panel">
          <summary>Description</summary>
          <div id="detail-description" class="detail-text detail-scroll"></div>
        </details>
        <details id="detail-transcript-panel">
          <summary>Full transcript</summary>
          <div id="detail-transcript" class="detail-text detail-scroll"></div>
        </details>
        <section class="detail-chat" aria-labelledby="detail-chat-heading">
          <div class="detail-chat-heading">
            <h3 id="detail-chat-heading">Ask about this video</h3>
            <button type="button" class="detail-chat-verify-pill" id="detail-chat-verify" title="Split the summary into claims and check each one against the web">
              Verify summary via web
            </button>
          </div>
          <div id="detail-chat-log" aria-live="polite"></div>
          <textarea id="detail-chat-input" placeholder="Ask a question about this video (Ctrl+Enter to send)" title="Ctrl+Enter to send"></textarea>
          <div class="detail-chat-controls">
            <label><input type="checkbox" id="detail-chat-web" checked /> Web search (latest, authoritative sources)</label>
            <button type="button" class="action" id="detail-chat-send">Send</button>
          </div>
          <div id="detail-chat-status" class="status"></div>
        </section>
      </div>
    </div>
  </dialog>
  <script>
    const $ = (id) => document.getElementById(id);
    let channels = [];
    let chart;
    let currentDetailVideoId = null;
    let detailChatMessages = [];

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function syncThemeToggle() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      const label = "Switch to " + next + " theme";
      const btn = $("theme-toggle");
      btn.title = label;
      btn.setAttribute("aria-label", label);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("wow-theme", theme);
      syncThemeToggle();
      if (chart && !$("view-trends").classList.contains("hidden")) loadTrends();
    }

    $("theme-toggle").addEventListener("click", () => {
      setTheme(currentTheme() === "dark" ? "light" : "dark");
    });
    syncThemeToggle();

    document.querySelectorAll("nav button[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav button[data-view]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        ["browse", "semantic", "ask", "trends"].forEach((name) => {
          $("view-" + name).classList.toggle("hidden", name !== btn.dataset.view);
        });
        if (btn.dataset.view === "trends") loadTrends();
      });
    });

    async function loadChannels() {
      channels = await (await fetch("/api/channels")).json();
      const select = $("channel");
      select.innerHTML = `<option value="">All channels</option>` +
        channels.map((c) => `<option value="${c.channel_id}">${escapeHtml(c.channel_name)}</option>`).join("");
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function ymd(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function daysAgoYmd(days) {
      const d = new Date();
      d.setDate(d.getDate() - days);
      return ymd(d);
    }

    function hoursAgoIso(hours) {
      const d = new Date(Date.now() - hours * 3600 * 1000);
      return d.toISOString().replace(/\.\d{3}Z$/, "");
    }

    function dateBounds() {
      const preset = $("date-range").value;
      if (preset === "24h") return { from: hoursAgoIso(24), to: null, field: "published" };
      if (preset === "sync24h") return { from: hoursAgoIso(24), to: null, field: "processed" };
      if (preset === "7d") return { from: daysAgoYmd(7), to: null, field: "published" };
      if (preset === "30d") return { from: daysAgoYmd(30), to: null, field: "published" };
      if (preset === "90d") return { from: daysAgoYmd(90), to: null, field: "published" };
      if (preset === "ytd") {
        return { from: `${new Date().getFullYear()}-01-01`, to: null, field: "published" };
      }
      const from = $("date-from").value;
      const to = $("date-to").value ? $("date-to").value + "T23:59:59" : null;
      return { from: from || null, to, field: "published" };
    }

    function syncCustomDates() {
      $("custom-dates").classList.toggle("hidden", $("date-range").value !== "custom");
    }

    function videoParams() {
      const params = new URLSearchParams();
      const dates = dateBounds();
      if ($("channel").value) params.set("channel_id", $("channel").value);
      if (dates.from) {
        params.set("date_from", dates.from);
        params.set("date_field", dates.field || "published");
      }
      if (dates.to) params.set("date_to", dates.to);
      if ($("topic").value.trim()) params.set("topic", $("topic").value.trim());
      if ($("relevance").value) params.set("relevance", $("relevance").value);
      if ($("watched").value) params.set("watched", $("watched").value);
      if ($("keyword").value.trim()) params.set("q", $("keyword").value.trim());
      return params;
    }

    async function loadVideos() {
      $("browse-status").textContent = "Loading…";
      const videos = await (await fetch("/api/video?" + videoParams().toString())).json();
      $("browse-status").textContent = videos.length + " videos";
      $("video-rows").innerHTML = videos.map((v) => `
        <tr>
          <td>${escapeHtml((v.published_date || "").slice(0, 10))}</td>
          <td>${escapeHtml(v.channel_name)}</td>
          <td>
            <a href="${escapeAttr(v.url)}" target="_blank" rel="noreferrer">${escapeHtml(v.title)}</a>
            <button type="button" class="summary-link" data-id="${escapeAttr(v.video_id)}">${escapeHtml(v.summary || "")}</button>
          </td>
          <td class="rel-${escapeAttr(v.relevance)}">${escapeHtml(v.relevance)}</td>
          <td><div class="tags">${(v.topics || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div></td>
          <td><input type="checkbox" ${v.watched ? "checked" : ""} data-id="${escapeAttr(v.video_id)}" class="watch-toggle" /></td>
        </tr>
      `).join("");
      document.querySelectorAll(".watch-toggle").forEach((box) => {
        box.addEventListener("change", async () => {
          await fetch(`/api/video/${box.dataset.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ watched: box.checked }),
          });
        });
      });
      document.querySelectorAll(".summary-link").forEach((button) => {
        button.addEventListener("click", () => openVideoDetail(button.dataset.id));
      });
    }

    function resetDetailChat() {
      detailChatMessages = [];
      $("detail-chat-log").innerHTML = "";
      $("detail-chat-input").value = "";
      $("detail-chat-status").textContent = "";
      $("detail-chat-send").disabled = false;
      $("detail-chat-input").disabled = false;
      $("detail-chat-verify").disabled = false;
    }

    function chatMessageForApi(role, content, display) {
      const msg = { role, content };
      if (display && display !== content) msg.display = display;
      return msg;
    }

    function restoreDetailChat(transcript) {
      detailChatMessages = [];
      $("detail-chat-log").innerHTML = "";
      for (const msg of transcript || []) {
        if (msg.role === "user") {
          detailChatMessages.push(chatMessageForApi("user", msg.content, msg.display));
          appendChatBubble("user", msg.display || msg.content);
        } else if (msg.role === "assistant") {
          detailChatMessages.push({ role: "assistant", content: msg.content });
          appendChatBubble("assistant", msg.content, msg.web_sources, msg.web_provider);
        }
      }
    }

    function appendChatBubble(role, text, webSources, webProvider) {
      const bubble = document.createElement("div");
      bubble.className = "chat-bubble " + role;
      bubble.textContent = text;
      if (role === "assistant" && webSources && webSources.length) {
        const foot = document.createElement("div");
        foot.className = "chat-web-footnote";
        const label = webProvider ? `Web (${webProvider}): ` : "Web: ";
        foot.innerHTML = label + webSources.map((s) =>
          `<a href="${escapeAttr(s.url)}" target="_blank" rel="noreferrer">${escapeHtml(s.title || s.url)}</a>`
        ).join(" · ");
        bubble.appendChild(foot);
      }
      $("detail-chat-log").appendChild(bubble);
      $("detail-chat-log").scrollTop = $("detail-chat-log").scrollHeight;
    }

    async function sendDetailChat(options = {}) {
      if (!currentDetailVideoId) return;
      const text = (options.text ?? $("detail-chat-input").value).trim();
      if (!text) return;
      const displayText = options.displayText ?? text;
      const webSearch = options.forceWebSearch ?? $("detail-chat-web").checked;

      detailChatMessages.push(chatMessageForApi("user", text, displayText));
      appendChatBubble("user", displayText);
      if (!options.text) $("detail-chat-input").value = "";
      $("detail-chat-status").textContent = options.verify ? "Checking each claim…" : "Thinking…";
      $("detail-chat-send").disabled = true;
      $("detail-chat-input").disabled = true;
      $("detail-chat-verify").disabled = true;

      try {
        const response = await fetch(
          `/api/video/${encodeURIComponent(currentDetailVideoId)}/chat`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: detailChatMessages,
              web_search: webSearch,
              verify: Boolean(options.verify),
            }),
          },
        );
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || "Could not get an answer.");
        }
        const answer = data.answer || "No answer";
        detailChatMessages.push({ role: "assistant", content: answer });
        appendChatBubble("assistant", answer, data.web_sources, data.web_provider);
        if (Array.isArray(data.chat_transcript)) {
          detailChatMessages = data.chat_transcript.map((msg) => {
            if (msg.role === "user") {
              return chatMessageForApi("user", msg.content, msg.display);
            }
            return { role: "assistant", content: msg.content };
          });
        }
        $("detail-chat-status").textContent = "";
      } catch (error) {
        detailChatMessages.pop();
        $("detail-chat-log").lastElementChild?.remove();
        $("detail-chat-status").textContent = error.message || "Could not get an answer.";
      } finally {
        $("detail-chat-send").disabled = false;
        $("detail-chat-input").disabled = false;
        $("detail-chat-verify").disabled = false;
        $("detail-chat-input").focus();
      }
    }

    function verifySummaryViaWeb() {
      $("detail-chat-web").checked = true;
      sendDetailChat({
        text: "Verify this video's summary against current web sources.",
        displayText: "Verify summary via web",
        forceWebSearch: true,
        verify: true,
      });
    }

    async function openVideoDetail(videoId) {
      const dialog = $("video-detail");
      currentDetailVideoId = videoId;
      resetDetailChat();
      $("detail-title").textContent = "Video details";
      $("detail-meta").textContent = "";
      $("detail-description-panel").open = false;
      $("detail-transcript-panel").open = false;
      $("detail-status").textContent = "Loading…";
      $("detail-content").classList.add("hidden");
      $("detail-delete").disabled = true;
      dialog.showModal();
      try {
        const response = await fetch(`/api/video/${encodeURIComponent(videoId)}`);
        if (!response.ok) throw new Error("Could not load video details.");
        const video = await response.json();
        $("detail-title").textContent = video.title || "Video details";
        $("detail-meta").textContent = [
          video.channel_name,
          (video.published_date || "").slice(0, 10),
        ].filter(Boolean).join(" · ");
        $("detail-long-summary").textContent =
          video.long_summary || "Detailed summary is unavailable for this previously processed video.";
        $("detail-takeaways").innerHTML = (video.key_takeaways || [])
          .map((item) => `<li>${escapeHtml(item)}</li>`)
          .join("");
        $("detail-description-panel").open = false;
        $("detail-description").textContent = video.description || "No description for this video.";
        $("detail-transcript-panel").open = false;
        $("detail-transcript").textContent =
          video.transcript || "Transcript is unavailable for this previously processed video.";
        restoreDetailChat(video.chat_transcript);
        $("detail-status").textContent = "";
        $("detail-content").classList.remove("hidden");
        $("detail-delete").disabled = false;
      } catch (error) {
        $("detail-status").textContent = error.message || "Could not load video details.";
      }
    }

    $("detail-close").addEventListener("click", () => $("video-detail").close());
    $("detail-delete").addEventListener("click", async () => {
      if (!currentDetailVideoId) return;
      const title = $("detail-title").textContent || "this video";
      if (!window.confirm(`Permanently delete "${title}" from the archive?`)) return;

      const button = $("detail-delete");
      button.disabled = true;
      $("detail-status").textContent = "Deleting…";
      try {
        const response = await fetch(
          `/api/video/${encodeURIComponent(currentDetailVideoId)}`,
          { method: "DELETE" },
        );
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || "Could not delete video.");
        }
        $("video-detail").close();
        await loadVideos();
      } catch (error) {
        $("detail-status").textContent = error.message || "Could not delete video.";
        button.disabled = false;
      }
    });
    $("detail-chat-send").addEventListener("click", () => sendDetailChat());
    $("detail-chat-verify").addEventListener("click", verifySummaryViaWeb);
    onSubmitShortcut($("detail-chat-input"), () => sendDetailChat());

    $("video-detail").addEventListener("close", () => {
      currentDetailVideoId = null;
      resetDetailChat();
    });
    $("video-detail").addEventListener("click", (event) => {
      if (event.target === $("video-detail")) $("video-detail").close();
    });

    function highlightedTextWithin(root) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return "";
      const anchor = selection.anchorNode;
      if (!anchor || !root.contains(anchor)) return "";
      return selection.toString().replace(/\s+/g, " ").trim();
    }

    document.addEventListener("keydown", (event) => {
      const dialog = $("video-detail");
      if (!dialog.open) return;
      if (event.key !== "Enter" || event.repeat || event.isComposing) return;
      if (event.ctrlKey || event.metaKey || event.altKey || event.shiftKey) return;
      const query = highlightedTextWithin(dialog);
      if (!query) return;
      event.preventDefault();
      window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank",
        "noopener,noreferrer",
      );
    });

    $("date-range").addEventListener("change", () => {
      syncCustomDates();
      if ($("date-range").value !== "custom") loadVideos();
    });
    $("apply-filters").addEventListener("click", loadVideos);

    function onEnter(element, action) {
      element.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.isComposing || event.repeat) return;
        event.preventDefault();
        action();
      });
    }

    function onSubmitShortcut(element, action) {
      element.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.isComposing || event.repeat) return;
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        action();
      });
    }

    onEnter($("topic"), loadVideos);
    onEnter($("keyword"), loadVideos);
    onEnter($("date-from"), loadVideos);
    onEnter($("date-to"), loadVideos);

    async function runSemanticSearch() {
      const q = $("semantic-q").value.trim();
      if (!q) return;
      $("semantic-status").textContent = "Searching…";
      const hits = await (await fetch("/api/query?q=" + encodeURIComponent(q))).json();
      $("semantic-status").textContent = hits.length + " results";
      $("semantic-results").innerHTML = hits.map((v) => `
        <article>
          <h3><a href="${escapeAttr(v.url)}" target="_blank" rel="noreferrer">${escapeHtml(v.title)}</a></h3>
          <p class="muted">${escapeHtml(v.channel_name)} · ${escapeHtml((v.published_date || "").slice(0, 10))} · distance ${Number(v.distance).toFixed(3)}</p>
          <p>${escapeHtml(v.summary)}</p>
        </article>
      `).join("");
    }

    $("semantic-go").addEventListener("click", runSemanticSearch);
    onEnter($("semantic-q"), runSemanticSearch);

    async function runAsk() {
      const question = $("ask-q").value.trim();
      if (!question) return;
      $("ask-status").textContent = "Thinking…";
      $("ask-answer").textContent = "";
      $("ask-sources").innerHTML = "";
      const res = await fetch("/api/answers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      $("ask-status").textContent = "";
      $("ask-answer").textContent = data.answer || data.detail || "No answer";
      $("ask-sources").innerHTML = (data.sources || []).map((v) =>
        `<div><a href="${escapeAttr(v.url)}" target="_blank" rel="noreferrer">${escapeHtml(v.title)}</a> <span class="muted">— ${escapeHtml(v.channel_name)}</span></div>`
      ).join("");
    }

    $("ask-go").addEventListener("click", runAsk);
    onSubmitShortcut($("ask-q"), runAsk);

    async function loadTrends() {
      const period = $("trend-period").value;
      const months = $("trend-months").value;
      const rows = await (await fetch(`/api/trends?period=${period}&months=${months}`)).json();
      const periods = [...new Set(rows.map((r) => r.period))];
      const topics = [...new Set(rows.map((r) => r.topic))].slice(0, 8);
      const colors = ["#e07a3d", "#7eb8a5", "#d4b15d", "#c97b84", "#8aa2d4", "#b5a58c", "#9ec27a", "#d08c5a"];
      const datasets = topics.map((topic, i) => ({
        label: topic,
        data: periods.map((p) => {
          const hit = rows.find((r) => r.topic === topic && r.period === p);
          return hit ? hit.count : 0;
        }),
        borderColor: colors[i],
        backgroundColor: "transparent",
        tension: 0.25,
      }));
      if (chart) chart.destroy();
      chart = new Chart($("trend-chart"), {
        type: "line",
        data: { labels: periods, datasets },
        options: {
          plugins: { legend: { labels: { color: cssVar("--ink") } } },
          scales: {
            x: { ticks: { color: cssVar("--muted") }, grid: { color: cssVar("--line") } },
            y: { ticks: { color: cssVar("--muted") }, grid: { color: cssVar("--line") }, beginAtZero: true },
          },
        },
      });
    }

    $("trend-go").addEventListener("click", loadTrends);

    function formatFetchStatus(snapshot) {
      if (!snapshot) return "Working…";
      const sil = snapshot.silence_seconds > 2
        ? ` · ${Math.round(snapshot.silence_seconds)}s since last update`
        : "";
      const phase = snapshot.phase ? `[${snapshot.phase}] ` : "";
      return phase + (snapshot.message || "Working…") + sil;
    }

    function parseSyncSnapshot(raw) {
      if (Array.isArray(raw)) {
        throw new Error(
          "GET /api/videos returned a video list, not sync status — reload the API so REST routes match the UI.",
        );
      }
      if (!raw || typeof raw !== "object" || typeof raw.running !== "boolean") {
        throw new Error("Unexpected sync status from server.");
      }
      return raw;
    }

    async function pollFetchUntilDone() {
      let delayMs = 1500;
      for (;;) {
        const snapshot = parseSyncSnapshot(await (await fetch("/api/videos")).json());
        $("fetch-status").textContent = formatFetchStatus(snapshot);
        if (!snapshot.running) {
          if (snapshot.error) throw new Error(snapshot.error);
          return snapshot;
        }
        const silence = snapshot.silence_seconds || 0;
        if (silence > 120) delayMs = 5000;
        else if (silence > 30) delayMs = 3000;
        else delayMs = 1500;
        await new Promise((r) => setTimeout(r, delayMs));
      }
    }

    async function resumeSyncPollIfNeeded() {
      let snapshot;
      try {
        snapshot = parseSyncSnapshot(await (await fetch("/api/videos")).json());
      } catch {
        return;
      }
      if (!snapshot.running) return;
      $("fetch-status").textContent = formatFetchStatus(snapshot);
      setFetchBusy(true);
      try {
        const snapshot = await pollFetchUntilDone();
        $("fetch-status").textContent = formatFetchResult(snapshot);
        await loadChannels();
        await loadVideos();
      } catch (err) {
        $("fetch-status").textContent = err && err.message ? err.message : "Fetch failed";
      } finally {
        setFetchBusy(false);
      }
    }

    function setFetchBusy(busy) {
      $("fetch-latest").disabled = busy;
      $("fetch-url-now").disabled = busy;
      $("fetch-url-input").disabled = busy;
      $("fetch-latest").classList.toggle("busy", busy);
      $("fetch-url-now").classList.toggle("busy", busy);
    }

    function formatFetchResult(snapshot) {
      const data = snapshot && snapshot.result && typeof snapshot.result === "object"
        ? snapshot.result
        : {};
      if (data.video_id && Number(data.inbox_rows) === 1) {
        const label = data.outcome || (data.processed ? "processed" : data.skipped ? "skipped" : "failed");
        return `Video ${data.video_id}: ${label}`;
      }
      const hasCounts =
        data.inbox_rows != null
        || data.fetched != null
        || data.scanned != null
        || data.processed != null;
      if (!hasCounts) {
        return snapshot.message || "Sync finished.";
      }
      const inbox = data.inbox_rows ?? data.fetched ?? 0;
      const scanned = data.scanned ?? data.fetched ?? 0;
      const processed = data.processed ?? 0;
      const skipped = data.skipped ?? 0;
      const failed = data.failed ?? 0;
      let msg =
        `Scanned ${scanned} of ${inbox} inbox: ${processed} processed, ${skipped} skipped, ${failed} failed`;
      if (processed > 0) {
        msg += " — use Synced last 24 hours to see what this run added";
      } else if (skipped > 0) {
        msg += " — raise YOUTUBE_NOTIFICATIONS_SCAN_LIMIT if the inbox backlog is deep";
      }
      return msg;
    }

    async function runFetch(startRequest, startingMessage) {
      setFetchBusy(true);
      $("fetch-status").textContent = startingMessage;
      try {
        const res = await startRequest();
        const body = await res.json().catch(() => ({}));
        if (res.status === 409) {
          $("fetch-status").textContent = body.detail || "Fetch already running";
          const snapshot = await pollFetchUntilDone();
          $("fetch-status").textContent = formatFetchResult(snapshot);
          await loadChannels();
          await loadVideos();
          return;
        }
        if (!res.ok && res.status !== 202) {
          $("fetch-status").textContent = typeof body.detail === "string" ? body.detail : "Fetch failed";
          return;
        }
        const snapshot = await pollFetchUntilDone();
        $("fetch-status").textContent = formatFetchResult(snapshot);
        await loadChannels();
        await loadVideos();
      } catch (err) {
        $("fetch-status").textContent = err && err.message ? err.message : "Fetch failed";
      } finally {
        setFetchBusy(false);
      }
    }

    $("fetch-latest").addEventListener("click", () => {
      if ($("fetch-latest").disabled) return;
      runFetch(
        () => fetch("/api/videos", { method: "POST" }),
        "Starting fetch…",
      );
    });

    function startUrlFetch() {
      if ($("fetch-url-now").disabled) return;
      const url = $("fetch-url-input").value.trim();
      if (!url) {
        $("fetch-status").textContent = "Enter a YouTube URL";
        return;
      }
      runFetch(
        () => fetch("/api/video", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        }),
        "Starting fetch…",
      );
    }

    $("fetch-url-now").addEventListener("click", startUrlFetch);
    onEnter($("fetch-url-input"), startUrlFetch);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    loadChannels().then(loadVideos).then(resumeSyncPollIfNeeded);
  </script>
</body>
</html>
