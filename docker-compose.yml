services:
  wow:
    build: .
    image: wow-youtube:local
    container_name: wow-youtube
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WOW_ROOT: /app
      WOW_CONFIG_DIR: /app/config
      WOW_DATA_DIR: /app/data
      HF_HOME: /app/data/hf
      PYTHONPATH: /app/apps/api/src:/app/apps/poller/src:/app/packages/core/src
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: uvicorn wow_api.app:app --host 0.0.0.0 --port 8000
