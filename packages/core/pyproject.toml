[project]
name = "wow-core"
version = "0.1.0"
description = "Shared library for the YouTube digest poller and API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.64",
    "chromadb>=1.0",
    "feedparser>=6.0",
    "faster-whisper>=1.1",
    "python-dotenv>=1.1",
    "sentence-transformers>=3.0",
    "youtube-transcript-api>=1.2",
    "yt-dlp[default]>=2025.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_core"]
